# Çeviri — TR<->EN with content-word accuracy checks.
items:
  - id: ceviri/tr-en-urun
    category: ceviri
    difficulty: 1
    prompt: >-
      Aşağıdaki cümleyi İngilizceye çevir. Yalnızca çeviriyi yaz.
      "Toprak nem sensörü, tarlalardaki su tüketimini yüzde 30 azaltır."
    checks:
      - type: contains
        terms: ["soil", "moisture", "sensor"]
      - type: contains
        terms: ["30%|thirty percent|30 percent"]
        mode: regex
      - type: count
        unit: words
        min: 6
      - type: not_contains
        terms: ["toprak", "sensör"]

  - id: ceviri/en-tr-sonuc
    category: ceviri
    difficulty: 2
    prompt: >-
      Aşağıdaki cümleyi Türkçeye çevir. Yalnızca çeviriyi yaz.
      "The committee postponed the decision to the next meeting."
    checks:
      - type: contains
        terms: ["ertel"]
        mode: regex
      - type: word_order
        terms: ["komite", "toplant"]
      - type: turkish_share
        min: 0.6
      - type: not_contains
        terms: ["committee", "decision", "postpone"]
      - type: spelling_rules

  - id: ceviri/tr-en-ettirgen
    category: ceviri
    difficulty: 3
    prompt: >-
      Aşağıdaki cümleyi İngilizceye çevir. Yalnızca çeviriyi yaz.
      "Teknisyen arızalı yazıcıyı tamir ettirdi."
      (Anlam: teknisyen birine tamir ETTİRDİ — kendisi yapmadı.)
    checks:
      - type: contains
        terms: ["repaired|fixed"]
        mode: regex
      - type: contains
        terms: ["had|got|have it"]
        mode: regex
      - type: not_contains
        terms: ["teknisyen", "arıza"]

  - id: ceviri/tr-en-kosul
    category: ceviri
    difficulty: 2
    prompt: >-
      Aşağıdaki cümleyi İngilizceye çevir. Yalnızca çeviriyi yaz.
      "Toplantı zamanında başlarsa, öğleden önce bitecek."
    checks:
      - type: contains
        terms: ["if", "meeting"]
      - type: contains
        terms: ["on time", "before noon", "ends?|ends|finish"]
        mode: regex
      - type: not_contains
        terms: ["toplantı", "öğleden"]
      - type: count
        unit: words
        min: 6

  - id: ceviri/en-tr-sure
    category: ceviri
    difficulty: 1
    prompt: >-
      Aşağıdaki cümleyi Türkçeye çevir. Yalnızca çeviriyi yaz.
      "The delivery takes two business days."
    checks:
      - type: contains
        terms: ["iki", "iş günü|is gunu"]
        mode: regex
      - type: contains
        terms: ["teslim|kargo"]
        mode: regex
      - type: turkish_share
        min: 0.6
      - type: not_contains
        terms: ["delivery", "business"]
      - type: spelling_rules

  - id: ceviri/tr-en-kayip
    category: ceviri
    difficulty: 3
    prompt: >-
      Aşağıdaki cümleyi İngilizceye çevir. Yalnızca çeviriyi yaz.
      "Anahtarımı kaybettim; içeri giremiyorum."
    checks:
      - type: contains
        terms: ["lost|misplaced"]
        mode: regex
      - type: contains
        terms: ["key"]
      - type: contains
        terms: ["can't|cannot|can not"]
        mode: regex
      - type: not_contains
        terms: ["anahtar", "kaybettim"]

  - id: ceviri/en-tr-kayit
    category: ceviri
    difficulty: 2
    prompt: >-
      Aşağıdaki cümleyi Türkçeye çevir. Yalnızca çeviriyi yaz.
      "The registration deadline is Friday."
    checks:
      - type: contains
        terms: ["cuma"]
      - type: contains
        terms: ["kayıt|kayit|son gün|son"]
        mode: regex
      - type: turkish_share
        min: 0.55
      - type: not_contains
        terms: ["registration", "deadline", "friday"]
      - type: spelling_rules
