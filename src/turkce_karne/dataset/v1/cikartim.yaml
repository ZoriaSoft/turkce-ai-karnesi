# Çıkartım — field extraction from messy OCR-like Turkish documents.
# All documents are fictional; names/numbers invented for this dataset.
items:
  - id: cikartim/fatura
    category: cikartim
    difficulty: 3
    prompt: >-
      Aşağıdaki fatura metninden alanları çıkar ve YALNIZCA JSON yaz
      (açıklama yok). Alanlar: satici_unvan, fatura_no, tarih, ara_toplam,
      kdv, genel_toplam.
    input: |
      YILDIZ GIDA  TIC. LTD. STI.
      Merkez Mah. Sanayi Cd. No:44  Esenler/ISTANBUL
      VN: 8350049217   Mersis: 0835004921700014
      FATURA NO: YGD2026-00812
      Tarih: 12.10.2026   Saat: 14:35
      --------------------------------
      4x Bakliyat (kg)     42,50   170,00
      2x Zeytinyağı 1L     310,00  620,00
      --------------------------------
      ARA TOPLAM:  790,00 TL
      KDV %10:      79,00 TL
      GENEL TOPLAM: 869,00 TL
      Odeme: KREDI KARTI
      Teşekkürler. Iade icin fatura ibrazi zorunludur.
    expected:
      satici_unvan: "YILDIZ GIDA TIC. LTD. STI."
      fatura_no: "YGD2026-00812"
      tarih: "2026-10-12"
      ara_toplam: 790
      kdv: 79
      genel_toplam: 869
    checks:
      - type: json_fields
        strict: true
      - type: not_contains
        terms: ["açıklama", "not:"]

  - id: cikartim/tutanak
    category: cikartim
    difficulty: 3
    prompt: >-
      Aşağıdaki hasar tespit tutanağından alanları çıkar ve YALNIZCA JSON
      yaz. Alanlar: tutanak_no, tarih, adres, kisiler (virgülle ayrılmış
      liste değil, tek string), hasar_ozeti.
    input: |
      HASAR TESPIT TUTANAGI
      Tutanak No: 2026-1147
      Tarih/Saat: 15.10.2026 / 09:40
      Adres: Camikebir Mah. Sahil Sk. No:9 D:3 Mudanya/BURSA
      Tutanağa katılanlar: Ev sahibi Nurten Şen, yönetici İsmail
      Korkmaz, eksper Levent Aksoy
      Olay: Binanın 4. kat dairesindeki mutfak tavanında su sızıntısı
      tespit edilmiştir. Sızıntının 5. kattaki daire banyosundan
      kaynaklandığı düşünülmektedir. Alçıpan tavanda 60x80 cm'lik
      alanda kabarma ve renk değişimi gözlemlenmiştir.
      Sonuç: Üst kat tesisatının kontrol edilmesine karar verilmiştir.
    expected:
      tutanak_no: "2026-1147"
      tarih: "2026-10-15"
      adres: "Camikebir Mah. Sahil Sk. No:9 D:3 Mudanya/BURSA"
      kisiler: "Nurten Şen, İsmail Korkmaz, Levent Aksoy"
      hasar_ozeti: "su sızıntısı"
    checks:
      - type: json_fields
        required: [tutanak_no, tarih]

  - id: cikartim/irsaliye
    category: cikartim
    difficulty: 2
    prompt: >-
      Aşağıdaki irsaliyeden alanları çıkar ve YALNIZCA JSON yaz.
      Alanlar: irsaliye_no, gonderen, alici, kalem_sayisi.
    input: |
      SEVK IRSALIYESI
      Irsaliye No: IR-2026-5543
      Gonderen: Anadolu Ambalaj San. A.S. (Konya OSB)
      Alici: Berrin Kozmetik Ltd. - Depo 2
      Urunler:
       - Karton kutu 40x30x20, adet: 500
       - Bant (seffaf), adet: 24
       - Streç film 50cm, rulo: 60
      Sofor: Hüseyin Demirtaş   Plaka: 34 KLM 208
      Sevk tarihi: 16.10.2026
    expected:
      irsaliye_no: "IR-2026-5543"
      gonderen: "Anadolu Ambalaj San. A.S."
      alici: "Berrin Kozmetik Ltd."
      kalem_sayisi: 3
    checks:
      - type: json_fields
        strict: true

  - id: cikartim/trafik-tutanak
    category: cikartim
    difficulty: 4
    prompt: >-
      Aşağıdaki trafik kazası tespit tutanağından alanları çıkar ve
      YALNIZCA JSON yaz. Alanlar: tutanak_no, kaza_tarihi, plaka_a,
      plaka_b, surucu_a, surucu_b, kusurlu_taraf.
    input: |
      TRAFIK KAZASI TESPIT TUTANAGI
      Tut. No: KB-2026/3301      Kaza Tarihi: 14.10.2026  Saat: 08:15
      Yer: Ataturk Bulvari 1207. Sk kavsagi, Cankaya/ANKARA
      Arac A: 06 ABC 341   Surucu: Okan Saglam
      Arac B: 34 TRC 908   Surucu: Pinar Erbas
      Olay ozeti: A araci kavsakte durmadan gecmis, onden giden B
      aracina arkadan carpmistir. Maddi hasar disinda yaralanan yok.
      Gozcu: yok. Karar: A araci surucusu takip mesafesini
      korumadigindan kusurludur.
    expected:
      tutanak_no: "KB-2026/3301"
      kaza_tarihi: "2026-10-14"
      plaka_a: "06 ABC 341"
      plaka_b: "34 TRC 908"
      surucu_a: "Okan Saglam"
      surucu_b: "Pinar Erbas"
      kusurlu_taraf: "A"
    checks:
      - type: json_fields
        required: [tutanak_no, kaza_tarihi, kusurlu_taraf]

  - id: cikartim/recete
    category: cikartim
    difficulty: 3
    prompt: >-
      Aşağıdaki reçete metninden alanları çıkar ve YALNIZCA JSON yaz.
      Alanlar: doktor, hasta, tarih, ilac_sayisi.
    input: |
      SAGLIK OCAKI RECETESI
      Dr. Aylin Koroglu   Dahiliye Uzmani
      Hasta: Sukru Yalcin    Sicil: A-2041
      Tarih: 16.10.2026
      Rp/ 1. Paracetamol 500mg tb 2x1
         2. Ibuprofen 400mg tb 3x1
         3. Vitamin D3 damla 1x10
      Teshis: ust solunum yolu enfeksiyonu
      Not: bol sivi, dinlenme onerildi.
    expected:
      doktor: "Aylin Koroglu"
      hasta: "Sukru Yalcin"
      tarih: "2026-10-16"
      ilac_sayisi: 3
    checks:
      - type: json_fields
        strict: true

  - id: cikartim/siparis-formu
    category: cikartim
    difficulty: 3
    prompt: >-
      Aşağıdaki karışık sipariş çıktısından alanları çıkar ve YALNIZCA
      JSON yaz. Alanlar: musteri, siparis_no, odeme_turu, tutar.
    input: |
      *** SIPARIS OZETI ***
      Musteri : Gorkem Saglam (gorkem@example-mail.com)
      Siparis No : SP-99120
      Kalem : Bluetooth kulaklik x1 - birim 1.299,90 TL
      Kargo : 49,90 TL   Odeme : HAVALE/EFT
      ----------------------------------------------
      TOPLAM : 1.349,80 TL
      Teslimat adresi: Fener Mah. Deniz Sk. 5/2 Antalya
      Not: Kapiya birakabilirsiniz.
    expected:
      musteri: "Gorkem Saglam"
      siparis_no: "SP-99120"
      odeme_turu: "HAVALE/EFT"
      tutar: 1349.80
    checks:
      - type: json_fields
        strict: true

  - id: cikartim/rehber-kayit
    category: cikartim
    difficulty: 2
    prompt: >-
      Aşağıdaki dağınık rehber kaydından alanları çıkar ve YALNIZCA
      JSON yaz. Alanlar: ad_soyad, telefon, sehir, meslek.
    input: |
      kayit >> AD: serap ulusoy << tel: 0532 671 44 90
      sehir: IZMIR - meslek: mimar (ofis: Bornova)
      notlar: 2024 fuarindan kalma kartvizit; eposta okunamiyor
    expected:
      ad_soyad: "Serap Ulusoy"
      telefon: "0532 671 44 90"
      sehir: "IZMIR"
      meslek: "mimar"
    checks:
      - type: json_fields
        required: [ad_soyad, telefon]
