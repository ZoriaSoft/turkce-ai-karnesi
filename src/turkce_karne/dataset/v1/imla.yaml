# İmla — Turkish spelling rules: de/da, ki, mi, bitişik yazım, TDK traps.
items:
  - id: imla/de-da
    category: imla
    difficulty: 2
    prompt: >-
      Aşağıdaki cümledeki de/da yazım hatalarını düzelt ve yalnızca düzeltilmiş
      cümleyi yaz.
      "Ben marketede gittim ama araba da bekleyen biri vardı."
    checks:
      - type: contains
        terms: ["markete de", "arabada"]
      - type: not_contains
        terms: ["marketede", "araba da "]
      - type: answer_line
        value: "Ben markete de gittim ama arabada bekleyen biri vardı."
    notes: >-
      Errors: 'marketede' must split (particle de), 'araba da' must join
      (locative suffix). Both corrections are canonical.

  - id: imla/ki
    category: imla
    difficulty: 2
    prompt: >-
      Aşağıdakilerden hangisinde 'ki' bitişik yazılmalıdır? Yalnızca doğru
      şıkkın harfini yaz.
      A) "Evdeki kitap"  B) "Duydum ki gelmişsin"  C) "Öyle ki herkes şaşırdı"
      D) "Bilmem ki ne desem"
    checks:
      - type: answer_in
        answers: ["A", "a"]
    notes: >-
      Only A is the -ki suffix (evdeki); B-D are the conjunction "ki", written
      separately. Fixed 2026-10-19: earlier options (belki, oysaki, sanki)
      are also written fused, so the old item had four correct answers.

  - id: imla/mi-mi
    category: imla
    difficulty: 1
    prompt: >-
      "Süt ...?" cümlesinde soru ekinin doğru biçimi nedir? Yalnızca eki yaz
      (ör: mı/mi/mu/mü biçiminde).
    checks:
      - type: answer_in
        answers: ["mü", "mü?"]
    notes: >-
      "Süt" has the rounded front vowel ü, so the particle is "mü" (Süt mü?).
      Fixed 2026-10-19: earlier gold answer "mı" was wrong.

  - id: imla/bitisik
    category: imla
    difficulty: 2
    prompt: >-
      Hangi kelime TDK'ya göre bitişik yazılır? Yalnızca doğru kelimeyi yaz.
      A) "her şey"   B) "hiç bir"   C) "yemek kaşığı"   D) "bir şey"
    checks:
      - type: answer_in
        answers: ["B", "b", "hiçbir"]

  - id: imla/hersey-yalniz
    category: imla
    difficulty: 2
    prompt: >-
      Aşağıdaki cümledeki yazım hatalarını düzelt ve yalnızca düzeltilmiş
      cümleyi yaz.
      "Herşeyi tek başıma yapmak zorunda kaldım, yalnız başına çalışmak
      yorucu."
    checks:
      - type: written_form
        correct: ["her şeyi", "yalnız başına"]
        incorrect: ["herşey", "yanlız"]
      - type: answer_line
        value: "Her şeyi tek başıma yapmak zorunda kaldım, yalnız başına çalışmak yorucu."
    notes: >-
      'Herşey' -> 'her şey' (ayrı yazılır). 'yalnız başına' zaten doğru;
      modelin bozmaması gerekir.

  - id: imla/kisaltma-nokta
    category: imla
    difficulty: 3
    prompt: >-
      TDK'ya göre aşağıdaki akademik unvan kısaltmalarından hangisi doğru
      yazılmıştır? Yalnızca doğru şıkkın harfini yaz.
      A) Dr  B) Dr.  C) DR  D) dr
    checks:
      - type: answer_in
        answers: ["B", "b", "Dr."]
    notes: "Unvan kısaltmaları nokta ile biter: Dr., Prof. Dr., Av."

  - id: imla/bitisik-secimi
    category: imla
    difficulty: 2
    prompt: >-
      Aşağıdakilerden hangisi bitişik yazılır? Yalnızca doğru kelimeyi
      yaz.
      A) "her halükarda"   B) "bil miyorum"   C) "bilmiyorum"
      D) "yanlız"
    checks:
      - type: answer_in
        answers: ["C", "c", "bilmiyorum"]

  - id: imla/ek-ayrimi
    category: imla
    difficulty: 3
    prompt: >-
      Aşağıdaki cümlelerden hangisinde ek ve bağlaç yazımı tamamen
      doğrudur? Yalnızca şık harfini yaz.
      A) Ankara'ya da gidecek.
      B) Okulada gidiyor.
      C) Benimde fikrim var.
      D) İstanbula yarın dönüyor.
    checks:
      - type: answer_in
        answers: ["A", "a"]
    notes: >-
      B: 'okula da' ayrı; C: 'benim de' ayrı; D: 'İstanbul'a' kesme
      gerekir. A'da yöneltme eki ve 'da' bağlacı doğru.

  - id: imla/serbest-duzelt
    category: imla
    difficulty: 3
    prompt: >-
      Aşağıdaki paragraftaki tüm yazım hatalarını düzelt ve yalnızca
      düzeltilmiş paragrafı yaz.
      "Yanlız kaldığım için herşeyi tek başıma yapmak zorunda kaldım.
      Dün ki toplantıya geldimmi kimse bendeki anahtarı sormadı."
    checks:
      - type: written_form
        correct: ["yalnız", "her şeyi", "dünkü", "geldim mi", "bendeki"]
        incorrect: ["yanlız", "herşeyi", "dün ki", "geldimmi"]
      - type: spelling_rules
      - type: turkish_share
        min: 0.5
    notes: >-
      Üç farklı hata sınıfı bir arada: yanlız->yalnız, herşeyi->her şeyi
      (ayrı yazım), dün ki->dünkü (-ki eki), geldimmi->geldim mi (soru
      eki), bendeki zaten doğru.

  - id: imla/mi-soru-cumleleri
    category: imla
    difficulty: 2
    prompt: >-
      Aşağıdaki soru cümlelerini doğru yazım ile yeniden yaz; her cümle
      kendi satırında olsun.
      "Yarınki sınava geliyormusun? Baban evdemi? Toplantıya katıldın mı?"
    checks:
      - type: written_form
        correct: ["geliyor musun", "evde mi", "katıldın mı"]
        incorrect: ["geliyormusun", "evdemi"]
      - type: spelling_rules
      - type: count
        unit: lines
        eq: 3
    notes: >-
      Soru eki ayrı yazımı + -ki eki (yarınki zaten doğru kalmalı).
      'evde mi' hem ek uyumu hem ayrı yazım testi.


  - id: imla/de-da-uyum
    category: imla
    difficulty: 2
    prompt: >-
      Aşağıdaki cümlelerdeki ayrı yazılan de/da bağlacının ünlü uyumu
      hatalarını düzelt ve yalnızca düzeltilmiş cümleleri yaz; her cümle
      kendi satırında olsun.
      "Kardeşim da geldi. Ben da yoruldum. Okul de yakınmış."
    checks:
      - type: written_form
        correct: ["kardeşim de", "ben de", "okul da"]
        incorrect: ["kardeşim da", "ben da", "okul de"]
      - type: spelling_rules
      - type: count
        unit: lines
        eq: 3
    notes: >-
      The de/da clitic vowel must harmonize with the last vowel of the
      preceding word; spelling_rules' de_da_harmony scan fails any output
      that keeps a wrong vowel, so partial fixes lose partial credit.
