# E-posta — subject line, greeting, body, closing.
items:
  - id: eposta/odev-ek-sure
    category: eposta
    difficulty: 1
    prompt: >-
      Üniversite ödevin için hocana ek süre isteyen kısa bir e-posta yaz.
      Hoca: Dr. Elif Kaya. Ders: İstatistik. Ödevin teslim tarihi geçiyor.
      E-posta "Konu:" satırı ile başlasın, nazik bir kapanışla bitsin.
    checks:
      - type: starts_with
        value: "Konu:"
      - type: contains
        terms: ["Elif Kaya"]
      - type: regex
        pattern: "Sayın|Saygıdeğer|Merhaba"
      - type: turkish_share
        min: 0.5
      - type: count
        unit: sentences
        min: 3

  - id: eposta/kargo-sikayet
    category: eposta
    difficulty: 2
    prompt: >-
      Online aldığın ürünün kargoda hasar gördüğünü bildiren şikayet e-postası
      yaz. Sipariş no: SPX-44781. Alıcı firma: Nova Market. "Konu:" satırı ile
      başla.
    checks:
      - type: starts_with
        value: "Konu:"
      - type: contains
        terms: ["SPX-44781", "hasar"]
      - type: turkish_share
        min: 0.5
      - type: count
        unit: sentences
        min: 3

  - id: eposta/is-basvurusu
    category: eposta
    difficulty: 2
    prompt: >-
      Yazılım geliştirici pozisyonuna başvuran kısa bir e-posta yaz.
      Başvuran: Deniz Aksoy. Pozisyon: Backend Geliştirici. Şirket: Atlas
      Bilişim. CV'nin eklendiğini belirt. "Konu:" satırı ile başla.
    checks:
      - type: starts_with
        value: "Konu:"
      - type: contains
        terms: ["Deniz Aksoy", "Backend"]
      - type: contains
        terms: ["CV"]
        mode: regex
      - type: turkish_share
        min: 0.45

  - id: eposta/toplandi-erteleme
    category: eposta
    difficulty: 1
    prompt: >-
      Yarınki toplantıyı ertelemek isteyen kısa bir e-posta yaz.
      Karşı taraf: Dr. Selim Yurt. Önerilen yeni zaman: gelecek hafta
      salı, saat 11:00. "Konu:" satırı ile başla.
    checks:
      - type: starts_with
        value: "Konu:"
      - type: contains
        terms: ["Selim Yurt", "salı"]
      - type: regex
        pattern: "erte|ertelen"
      - type: turkish_share
        min: 0.5

  - id: eposta/fiyat-teklifi
    category: eposta
    difficulty: 2
    prompt: >-
      Ofis mobilyası alımı için fiyat teklifi isteyen kısa e-posta yaz.
      Firma: Orka Ofis, ilgili kişi: Defne Hanım. Talep: 12 çalışma
      masası ve 12 ergonomik sandalye. "Konu:" satırı ile başla.
    checks:
      - type: starts_with
        value: "Konu:"
      - type: contains
        terms: ["Defne", "teklif", "12"]
      - type: turkish_share
        min: 0.5
      - type: count
        unit: sentences
        min: 3

  - id: eposta/hata-bildirimi
    category: eposta
    difficulty: 2
    prompt: >-
      TeknoApp uygulamasında yaşadığın giriş sorununu bildiren destek
      e-postası yaz. Sorun: şifre sıfırlama bağlantısı çalışmıyor,
      hata kodu E-417. "Konu:" satırı ile başla.
    checks:
      - type: starts_with
        value: "Konu:"
      - type: contains
        terms: ["E-417"]
      - type: contains
        terms: ["şifre|parola"]
        mode: regex
      - type: turkish_share
        min: 0.5
      - type: count
        unit: sentences
        min: 3

  - id: eposta/tesekkur
    category: eposta
    difficulty: 1
    prompt: >-
      Dünkü ürün demosu için teşekkür eden kısa bir e-posta yaz.
      Karşı taraf: Mehmet Bey. "Konu:" satırı ile başla, nazik kapanış
      ekle.
    checks:
      - type: starts_with
        value: "Konu:"
      - type: contains
        terms: ["Mehmet", "teşekkür"]
      - type: turkish_share
        min: 0.5
      - type: count
        unit: sentences
        min: 2
