# Resmi yazı / dilekçe — formal Turkish petition format.
# Correct layout: kurum adı → (konu) → Sayın ... → metin → tarih → ad + imza.
items:
  - id: resmi-yazi/dilekce-belge
    category: resmi-yazi
    difficulty: 2
    prompt: >-
      Aşağıdaki bilgilerle resmi dilekçe formatına uygun bir dilekçe yaz:
      Kurum: Nilüfer Üniversitesi Öğrenci İşleri
      Konu: Öğrenci belgesi (transkript) talebi
      Ad Soyad: Mehmet Aydın
      Öğrenci No: 20234015
      Tarih: 18 Ekim 2026
      Yalnızca dilekçe metnini yaz, açıklama ekleme.
    checks:
      - type: contains
        terms: ["Sayın", "transkript", "Mehmet Aydın", "20234015"]
      - type: word_order
        terms: ["Öğrenci İşleri", "Sayın", "Mehmet Aydın"]
      - type: regex
        pattern: "1[48]\\s+Ekim\\s+2026|Ekim\\s+2026"
      - type: turkish_share
        min: 0.5
      - type: spelling_rules

  - id: resmi-yazi/belediye-sikayet
    category: resmi-yazi
    difficulty: 2
    prompt: >-
      Mahallesindeki çukur ve bozuk yollarla ilgili belediyeye şikayet dilekçesi
      yaz. Dilekçe sahibi: Murat Demir, adres: Bahçelievler Mah. 12. Sokak No:5
      Bursa. Kurum: Nilüfer Belediyesi. Yalnızca dilekçe metnini ver.
    checks:
      - type: contains
        terms: ["Sayın", "çukur", "Murat Demir", "Bahçelievler"]
      - type: word_order
        terms: ["Belediye", "Sayın", "Murat Demir"]
      - type: turkish_share
        min: 0.5
      - type: count
        unit: sentences
        min: 2
      - type: spelling_rules

  - id: resmi-yazi/fatura-itiraz
    category: resmi-yazi
    difficulty: 3
    prompt: >-
      Yüksek gelen elektrik faturasına itiraz dilekçesi yaz.
      Bilgiler: Abone No 88210344, fatura dönemi Eylül 2026, tutar 1.240 TL,
      müşteri Ayşe Yıldız, kurum UEDAŞ. İtiraz gerekçesi: aynı dönemde evde
      bulunulmaması. Yalnızca dilekçe metnini ver.
    checks:
      - type: contains
        terms: ["88210344", "Ayşe Yıldız", "Eylül", "itiraz"]
      - type: word_order
        terms: ["Sayın", "itiraz", "Ayşe Yıldız"]
      - type: not_contains
        terms: ["tabii ki", "memnuniyetle"]
      - type: turkish_share
        min: 0.5
      - type: spelling_rules

  - id: resmi-yazi/izin-dilekcesi
    category: resmi-yazi
    difficulty: 2
    prompt: >-
      Aşağıdaki bilgilerle izin dilekçesi yaz:
      Kurum: Marmara Lisesi Müdürlüğü
      Öğrenci: Elif Şahin (10-B sınıfı)
      Talep: 20 Ekim 2026 Salı günü ailevi sebep nedeniyle bir gün izin.
      Veli adı: Zeynep Şahin
      Yalnızca dilekçe metnini yaz.
    checks:
      - type: contains
        terms: ["Sayın", "izin", "Elif Şahin", "Zeynep Şahin"]
      - type: regex
        pattern: "20\\s+Ekim|Ekim\\s+2026"
      - type: word_order
        terms: ["Müdür", "Sayın", "Zeynep"]
      - type: turkish_share
        min: 0.5
      - type: spelling_rules

  - id: resmi-yazi/kayip-bildirimi
    category: resmi-yazi
    difficulty: 3
    prompt: >-
      Öğrenci kimlik kartını kaybettiğini bildiren ve yenisinin
      düzenlenmesini isteyen resmi dilekçe yaz.
      Ad Soyad: Kemal Öz. Okul: Çamlıca Fen Lisesi. Öğrenci No: 1147.
      Kart 17 Ekim 2026'da okul servisinde kaybolmuştur.
      Yalnızca dilekçe metnini ver.
    checks:
      - type: contains
        terms: ["kayb", "kimlik", "Kemal Öz", "1147"]
      - type: word_order
        terms: ["Sayın", "Kemal Öz"]
      - type: count
        unit: sentences
        min: 3
      - type: turkish_share
        min: 0.5
      - type: spelling_rules

  - id: resmi-yazi/veli-toplantisi
    category: resmi-yazi
    difficulty: 2
    prompt: >-
      Ortaokul müdürlüğünün velilere göndereceği resmi toplantı davetini
      yaz. Toplantı: 26 Ekim 2026 Pazartesi, saat 14:00, konferans
      salonu. Gündem: dönem değerlendirmesi. Okul: Deniz Ortaokulu.
      Yalnızca davet metnini yaz.
    checks:
      - type: contains
        terms: ["veli", "toplantı", "1400", "davet"]
      - type: regex
        pattern: "(veli|toplant).*(davet|rica|katılım)|davet"
      - type: word_order
        terms: ["Sayın", "toplant"]
      - type: turkish_share
        min: 0.5
      - type: spelling_rules

  - id: resmi-yazi/yoklama-tutanagi
    category: resmi-yazi
    difficulty: 3
    prompt: >-
      Kısa bir ders yoklama tutanağı metni yaz. Ders: Matematik.
      Öğretmen: Hatice Erden. Tarih: 19.10.2026. Devamsız öğrenciler:
      9-A sınıfından Yusuf Can ve Merve Işık. Tutanağı düzenleyen:
      sınıf başkanı Ömer Akın. "TUTANAKTIR" ile başla, maddeli olsun.
    checks:
      - type: starts_with
        value: "TUTANAKTIR"
      - type: contains
        terms: ["Hatice Erden", "Yusuf Can", "Merve Işık", "Matematik"]
      - type: regex
        pattern: "19\\.?10\\.?2026|19\\s+Ekim\\s+2026"
      - type: count
        unit: lines
        min: 4
      - type: turkish_share
        min: 0.5
      - type: spelling_rules
