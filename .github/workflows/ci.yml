name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Tests (fake model server, no network)
        run: pytest -q
      - name: Dataset lint
        run: karne validate
      - name: OCR dataset freshness
        run: python scripts/gen_ocr_tasks.py --check
      - name: CLI smoke (dry-run, no API)
        run: karne run --model smoke-test --dry-run --sample 5

  dist:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Wheel contains bundled dataset
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith("dataset/v1/imla.yaml") for n in names), \
              "dataset not bundled in wheel"
          assert any(n.endswith("templates/scorecard.html.j2") for n in names)
          PY
