[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkce-karne"
version = "0.1.0"
description = "Evaluation kit for Turkish-capable LLMs: deterministic checks + HTML scorecard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZoriaSoft" }]
keywords = ["turkish", "llm", "evaluation", "benchmark", "scorecard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
karne = "turkce_karne.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turkce_karne = [
    "dataset/v1/*.yaml",
    "templates/*.html.j2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
